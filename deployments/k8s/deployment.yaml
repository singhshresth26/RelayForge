apiVersion: apps/v1
kind: Deployment
metadata:
  name: relayforge-api
  labels:
    app.kubernetes.io/name: relayforge
    app.kubernetes.io/component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: relayforge
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: relayforge
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: relayforge/api:latest
          args: ["api"]
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: relayforge-config
            - secretRef:
                name: relayforge-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relayforge-worker
  labels:
    app.kubernetes.io/name: relayforge
    app.kubernetes.io/component: worker
spec:
  replicas: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: relayforge
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: relayforge
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: relayforge/api:latest
          args: ["worker"]
          envFrom:
            - configMapRef:
                name: relayforge-config
            - secretRef:
                name: relayforge-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1024Mi"

